; Hook before recording and ordinary dialing in the [from-internal] 101 route:
; same => n,Set(PBX_VERIFY_RESULT=fallback)
; same => n,GosubIf($[${REGEX("^PJSIP/101-[0-9a-fA-F]+$" ${CHANNEL(name)})}]?pbx-call-verification-extension,s,1(101))
; same => n,ExecIf($["${PBX_VERIFY_RESULT}"="verified"]?Hangup(16))
;
; Attach a hook only to a provisioned extension route. The AGI checks the
; Asterisk-assigned source channel against that extension independently.
[pbx-call-verification-extension]
exten => s,1,Set(PBX_VERIFY_PENDING=0)
 same => n,Set(PBX_VERIFY_RESULT=fallback)
 same => n,Set(PBX_VERIFY_INTERNAL_EXTEN=${ARG1})
 same => n,Set(PBX_VERIFY_DID=+982166754123)
 same => n,AGI(/usr/local/libexec/pbx-verification-digitalogic,extension-preflight)
 same => n,GotoIf($["${PBX_VERIFY_PENDING}"!="1"]?done)
 same => n,Answer()
 same => n,StopMixMonitor()
 same => n,AGI(/usr/local/libexec/pbx-verification-digitalogic,extension-shortcut)
 same => n(done),Set(PBX_VERIFY_INTERNAL_EXTEN=)
 same => n,Return()
